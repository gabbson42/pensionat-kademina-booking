<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Kademina</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="../static/images/favicon.ico" />
    <!-- Bootstrap icons-->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
            rel="stylesheet"
    />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
            integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
            crossorigin="anonymous"
    />
    <link href="/style.css" rel="stylesheet" />
</head>

<body>
<!-- Navigation-->
<nav class="navbar navbar-expand-lg">
    <div class="container px-4 px-lg-5 m-4">
        <a class="navbar-brand" href="index"
        ><img src="/assets/black-font.png" alt="" width="200"
        /></a>
        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a
                            class="nav-link active"
                            aria-current="page"
                            href="/booking"
                            style="color: #021836"
                    >Booking</a
                    >
                </li>
                <li class="nav-item">
                    <a
                            class="nav-link active"
                            aria-current="page"
                            href="/Rooms"
                            style="color: #021836"
                    >Rooms</a
                    >
                </li>
                <li class="nav-item">
                    <a
                            class="nav-link active"
                            aria-current="page"
                            href="/customer"
                            style="color: #021836"
                    >Customers</a
                    >
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Header-->
<header class="py-1 bg-kademina">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Kademina Rooms</h1>
            <p class="lead fw-normal text-white mb-0">Stockholms best rooms!</p>
            <br />
            <div id="total-price"></div>
        </div>
    </div>
</header>

<div class="container py-5">
    <div class="row g-4">

        <div class="col-lg-4 col-md-6" th:each="room : ${allRooms}">
            <div class="card shadow-sm border-0 h-100 rounded-4 overflow-hidden">

                <img
                        class="card-img-top"
                        style="height: 250px; object-fit: cover"
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Imperial_Hotel_Osaka_regular_floor_standard_twin_room_20120630-001.jpg/1280px-Imperial_Hotel_Osaka_regular_floor_standard_twin_room_20120630-001.jpg"
                        alt="Room Image"
                />

                <!-- Room Details-->
                <div class="card-body p-4">
                    <div class="card-body">
                        <h4 class="card-title font-weight-bold mb-3">
                            Room <span th:text="${room.id}"></span>
                        </h4>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <strong>Type: </strong>
                                <span th:text="${room.type}"></span>
                            </li>
                            <li class="list-group-item">
                                <strong>Size: </strong>
                                <span th:text="${room.size}"></span>
                            </li>
                        </ul>
                        <!-- Reservation Details-->
                        <br>
                        <h5 class="fw-semibold mb-3 ">Reservations</h5>

                        <div
                                class="border rounded p-3 mb-3 bg-light"
                                th:if="${!#lists.isEmpty(room.roomReservations)}"
                        >
                            <div th:each="booking : ${room.roomReservations}">
                                <p class="fw-bolder">
                                    <strong>Booking: </strong>
                                    <span th:text="${booking.id}"></span>
                                </p>

                                <p class="fw-bolder">
                                    <strong>Customer: </strong>
                                    <span th:text="${booking.customerName}"></span>
                                </p>

                                <p class="fw-bolder">
                                    <strong>Checkin: </strong>
                                    <span th:text="${booking.checkInDate}"></span>
                                </p>

                                <p class="fw-bolder">
                                    <strong>Check-out: </strong>
                                    <span th:text="${booking.checkOutDate}"></span>
                                </p>

                                <p class="fw-bolder">
                                    <strong>Guests: </strong>
                                    <span th:text="${booking.numberOfGuests}"></span>
                                </p>

                                <p class="fw-bolder">
                                    <strong>Extra beds: </strong>
                                    <span th:text="${booking.extraBeds}"></span>
                                </p>
                            </div>
                        </div>
                        <!-- No Reservations -->
                        <div
                                th:if="${#lists.isEmpty(room.roomReservations)}"
                                class="alert alert-secondary mt-3"
                        >
                            No reservations for this room.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer-->
<footer class="py-5 bg-kademina">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Kademina 2026</p>
    </div>
</footer>

</body>
</html>
