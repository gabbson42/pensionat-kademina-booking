<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Customer Details</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round|Open+Sans">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="/style.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- Navigation-->
<nav class="navbar navbar-expand-lg">
    <div class="container px-4 px-lg-5 m-4">
        <a class="navbar-brand" href="/index"><img src="/assets/black-font.png" alt="" width="200"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="" style="color: #021836">Booking</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="" style="color: #021836">Rooms</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="/customer" style="color: #021836">Customers</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container-lg">
    <div class="table-responsive">
        <div class="table-wrapper">
            <div class="table-title">
                <div class="row">
                    <div class="col-sm-8"><h2>Customer <b>Details</b></h2></div>
                    <div class="col-sm-4">
                        <button type="button" class="btn btn-info add-new" data-bs-toggle="modal" data-bs-target="#addModal"><i class="fa fa-plus"></i> Add New</button>
                    </div>
                </div>
            </div>
            <div class="allCustomers" th:unless="${#lists.isEmpty(allCustomers)}">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Bookings</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="cust : ${allCustomers}">
                        <td th:text="${cust.name}"></td>
                        <td th:text="${cust.bookings != null ? #lists.size(cust.bookings) : 0}"></td>
                        <td>
                            <a class="edit" data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${cust.id}"
                               style="cursor: pointer;">
                                <i class="material-icons" title="Edit">&#xE254;</i>
                            </a>
                            <div class="modal fade" th:id="'editModal-' + ${cust.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <form th:action="@{/customer/edit/{id}(id=${cust.id})}" method="post">
                                            <div class="modal-header">
                                                <h4 class="modal-title">Edit Customer</h4>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-hidden="true"></button>
                                            </div>
                                            <div class="modal-body">
                                                <div class="form-group">
                                                    <label th:for="'name-' + ${cust.id}">Name</label>
                                                    <input type="text" class="form-control"
                                                           th:id="'name-' + ${cust.id}"
                                                           name="name"
                                                           th:value="${cust.name}" required>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                <button type="submit" class="btn btn-info">Submit</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            <a class="delete" data-bs-toggle="modal"
                               th:data-bs-target="'#deleteModal-' + ${cust.id}"
                               style="cursor: pointer;">
                                <i class="material-icons" title="Delete">&#xE872;</i>
                            </a>
                            <div class="modal fade" th:id="'deleteModal-' + ${cust.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h4 class="modal-title">Delete Customer</h4>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <p>Are you sure you want to delete <strong th:text="${cust.name}"></strong>?</p>
                                            <p class="text-warning"><small>This action cannot be undone.</small></p>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <form th:action="@{/customer/delete/{id}(id=${cust.id})}" method="post" style="display:inline;">
                                                <button type="submit" class="btn btn-danger">Delete</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div id="addModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/customer/add}" method="post">
                <div class="modal-header">
                    <h4 class="modal-title">Add Customer</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-hidden="true"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
<footer class="py-5 bg-kademina">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Kademina 2026</p>
    </div>
</footer>
</body>
</html>
