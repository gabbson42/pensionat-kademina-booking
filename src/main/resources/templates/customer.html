<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Customer Details</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round|Open+Sans">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="/style.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- Navigation-->
<nav class="navbar navbar-expand-lg">
    <div class="container px-4 px-lg-5 m-4">
        <a class="navbar-brand" href="/index"><img src="/assets/black-font.png" alt="" width="200"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span
                class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active color-kademina" aria-current="page" href="">Booking</a>
                </li>
                <li class="nav-item"><a class="nav-link active color-kademina" aria-current="page" href="">Rooms</a>
                </li>
                <li class="nav-item"><a class="nav-link active color-kademina" aria-current="page" href="/customer">Customers</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container-lg">
    <div class="table-responsive">
        <div class="table-wrapper">
            <div class="table-title">
                <div class="row">
                    <div class="col-sm-8 color-kademina"><h2>Customer <b>Details</b></h2></div>
                    <div class="col-sm-4">
                        <button type="button" class="btn btn-outline-kademina add-new" data-bs-toggle="modal"
                                data-bs-target="#addModal"><i class="fa fa-plus"></i> Add New
                        </button>
                    </div>
                </div>
            </div>
            <div class="allCustomers" th:unless="${#lists.isEmpty(allCustomers)}">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th class="color-kademina">ID</th>
                        <th class="color-kademina">Name</th>
                        <th class="color-kademina">Bookings</th>
                        <th class="color-kademina">Actions</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="cust : ${allCustomers}">
                        <td class="color-kademina" th:text="${cust.id}"></td>
                        <td class="color-kademina" th:text="${cust.name}"></td>
                        <td class="color-kademina"
                            th:text="${cust.bookings != null ? #lists.size(cust.bookings) : 0}"></td>
                        <td>
                            <a class="edit" data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${cust.id}">
                                <i class="material-icons" title="Edit">&#xE254;</i>
                            </a>
                            <div class="modal fade" th:id="'editModal-' + ${cust.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <form th:action="@{/customer/edit/{id}(id=${cust.id})}" method="post">
                                            <div class="modal-header">
                                                <h4 class="modal-title color-kademina">Edit Customer</h4>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                        aria-hidden="true"></button>
                                            </div>
                                            <div class="modal-body">
                                                <div class="form-group">
                                                    <label class="color-kademina" for="name"
                                                           th:for="'name-' + ${cust.id}">Name</label>
                                                    <input type="text" class="form-control"
                                                           th:id="'name-' + ${cust.id}"
                                                           name="name" id="name"
                                                           th:value="${cust.name}" required>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-outline-kademina"
                                                        data-bs-dismiss="modal">Cancel
                                                </button>
                                                <button type="submit" class="btn btn-outline-kademina">Submit</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            <a class="delete" data-bs-toggle="modal"
                               th:data-bs-target="'#deleteModal-' + ${cust.id}">
                                <i class="material-icons" title="Delete">&#xE872;</i>
                            </a>
                            <div class="modal fade" th:id="'deleteModal-' + ${cust.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h4 class="modal-title color-kademina">Delete Customer</h4>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                    aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <p>Are you sure you want to delete <strong th:text="${cust.name}"></strong>?
                                            </p>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-outline-kademina"
                                                    data-bs-dismiss="modal">Cancel
                                            </button>
                                            <form th:action="@{/customer/delete/{id}(id=${cust.id})}" method="post"
                                                  style="display:inline;">
                                                <button type="submit" class="btn btn-outline-kademina">Delete</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div id="addModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/customer/add}" method="post">
                <div class="modal-header">
                    <h4 class="modal-title color-kademina">Add Customer</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-hidden="true"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="customerName" class="color-kademina">Name</label>
                        <input id="customerName" name="name" type="text" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-kademina" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-outline-kademina">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
<footer class="py-5 bg-kademina">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Kademina 2026</p>
    </div>
</footer>
<div th:if="${message}"
     id="messageModal"
     class="modal fade"
     tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title color-kademina">Success</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="color-kademina" th:utext="${message}"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-kademina" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
<div th:if="${errorMessage}"
     id="errorModal"
     class="modal fade"
     tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title color-kademina">Cannot Delete Customer</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="color-kademina" th:utext="${errorMessage}"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-kademina" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
<script th:if="${errorMessage}">
    document.addEventListener('DOMContentLoaded', function () {
        const modal = new bootstrap.Modal(document.getElementById('errorModal'));
        modal.show();
    });
</script>
<script th:if="${message}">
    document.addEventListener('DOMContentLoaded', function () {
        const modal = new bootstrap.Modal(document.getElementById('messageModal'));
        modal.show();
    });
</script>
</body>
</html>
