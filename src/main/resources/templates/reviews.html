<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reviews</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Projektets CSS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container px-4 px-lg-5 m-4">

        <!-- Logo / Home -->
        <a class="navbar-brand" href="/index">
            <img src="/assets/black-font.png" alt="Pensionat Kademina" width="200">
        </a>

        <!-- Knapp för navbar på mindre skärmar -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">

                <li class="nav-item">
                    <a class="nav-link active color-kademina"
                       href="/customer">
                        Customers
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active color-kademina"
                       href="/booking">
                        Booking
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active color-kademina"
                       href="/Rooms">
                        Rooms
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active color-kademina"
                       aria-current="page"
                       href="/reviews">
                        Reviews
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- Reviews -->
<div class="container mt-5">

    <h1>Reviews</h1>

    <p>Leave a review.</p>

    <!-- Review form -->
    <form action="/reviews" method="post">

        <!-- Customer -->
        <div class="mb-3">
            <label for="customerId" class="form-label">
                Customer ID
            </label>

            <input type="number"
                   class="form-control"
                   id="customerId"
                   name="customerId"
                   required>
        </div>


        <!-- Room -->
        <div class="mb-3">
            <label for="roomId" class="form-label">
                Room ID
            </label>

            <input type="number"
                   class="form-control"
                   id="roomId"
                   name="roomId"
                   required>
        </div>


        <!-- Rating -->
        <div class="mb-3">
            <label for="rating" class="form-label">
                Rating
            </label>

            <select class="form-select"
                    id="rating"
                    name="rating"
                    required>

                <option value="">Choose rating</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>

            </select>
        </div>


        <!-- Comment -->
        <div class="mb-3">
            <label for="comment" class="form-label">
                Comment
            </label>

            <textarea class="form-control"
                      id="comment"
                      name="comment"
                      rows="4"></textarea>
        </div>


        <!-- Submit -->
        <button type="submit" class="btn btn-primary">
            Submit review
        </button>

    </form>

</div>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
